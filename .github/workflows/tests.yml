name: Tests backend

on:
  push:
    branches: [main, ci-tests-backend]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: siap-backend
    env:
      SECRET_KEY: ci-secret
      DATABASE_URL: sqlite:///./siap_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: siap-backend/requirements.txt
      # Bibliothèques système de WeasyPrint (rapports PDF)
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      # PyTorch en version CPU (plus léger) avant le reste des dépendances
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest tests -v
